<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 132" fill="none">
  <!-- Sample employee card (the first seeded employee). Decorative. -->
  <rect x="0.5" y="0.5" width="279" height="131" rx="12" style="fill: var(--color-neutral-0); stroke: var(--color-neutral-200)" />

  <circle cx="40" cy="44" r="20" style="fill: var(--color-primary-100)" />
  <text x="40" y="49" text-anchor="middle" style="font-family: var(--font-sans); font-size: 14px; font-weight: 600; fill: var(--color-primary-700)">JC</text>

  <text x="72" y="40" style="font-family: var(--font-sans); font-size: 14px; font-weight: 600; fill: var(--color-neutral-900)">Juan D. Cruz</text>
  <text x="72" y="58" style="font-family: var(--font-mono); font-size: 12px; fill: var(--color-neutral-600)">EMP-001</text>

  <rect x="206" y="28" width="54" height="22" rx="4" style="fill: var(--color-success-bg); stroke: var(--color-success-border)" />
  <text x="233" y="43" text-anchor="middle" style="font-family: var(--font-sans); font-size: 12px; font-weight: 500; fill: var(--color-success)">Active</text>

  <line x1="20" y1="82" x2="260" y2="82" style="stroke: var(--color-neutral-200)" />
  <text x="20" y="108" style="font-family: var(--font-sans); font-size: 12px; fill: var(--color-neutral-600)">Date hired</text>
  <text x="260" y="108" text-anchor="end" style="font-family: var(--font-sans); font-size: 12px; font-weight: 500; fill: var(--color-neutral-900)">Jan 16, 2023</text>
</svg>
